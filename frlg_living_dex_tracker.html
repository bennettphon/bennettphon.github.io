<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRLG Living Dex Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0a;--surface:#111;--text:#e0e0e0;--red:#cc3333;--red-light:#ff6644;--green:#4caf50}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
  .header{background:linear-gradient(135deg,#0a0a1a 0%,#0a1030 40%,#0a0a1a 100%);border-bottom:1px solid #111522;padding:24px 20px 20px;position:sticky;top:0;z-index:100}
  .header-inner{max-width:960px;margin:0 auto}
  .title-row{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .title{font-size:22px;font-weight:800;letter-spacing:-0.5px;background:linear-gradient(90deg,#4488ff,#44bbff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .subtitle{font-size:12px;color:#666;font-family:'JetBrains Mono',monospace}
  .progress-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .progress-count{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;color:#fff}
  .progress-count span{color:#555;font-size:16px}
  .progress-pct{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:800;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background:linear-gradient(90deg,#3366cc,#4499ff)}
  .progress-pct.done{background:linear-gradient(90deg,#4caf50,#88ee88);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none}
  .bar-bg{height:6px;background:#1a1a1a;border-radius:3px;overflow:hidden;margin-bottom:10px}
  .bar-fill{height:100%;border-radius:3px;transition:width 0.3s;background:linear-gradient(90deg,#3366cc,#4499ff)}
  .bar-fill.done{background:linear-gradient(90deg,#4caf50,#66bb6a)}
  .actions-row{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .controls{display:flex;gap:8px;flex-wrap:wrap}
  .search{flex:1 1 200px;padding:8px 12px;background:#151515;border:1px solid #2a2a2a;border-radius:6px;color:#ddd;font-size:13px;outline:none;font-family:'Outfit',sans-serif}
  .search:focus{border-color:#444}.search::placeholder{color:#555}
  .fbtn{padding:8px 14px;border-radius:6px;border:1px solid #2a2a2a;background:#151515;color:#888;font-size:12px;cursor:pointer;font-weight:600;font-family:'Outfit',sans-serif;transition:all 0.15s}
  .fbtn.active{border-color:var(--red);background:#2a1111;color:var(--red-light)}
  .tsel{padding:8px 12px;background:#151515;border:1px solid #2a2a2a;border-radius:6px;color:#ddd;font-size:12px;cursor:pointer;font-family:'Outfit',sans-serif}
  .list{max-width:960px;margin:0 auto;padding:12px 20px}
  .list-info{font-size:11px;color:#555;margin-bottom:8px;font-family:'JetBrains Mono',monospace}
  .row{display:flex;align-items:center;gap:8px;padding:10px 12px;margin-bottom:2px;background:var(--surface);border-left:3px solid #222;border-radius:0 4px 4px 0;cursor:pointer;transition:all 0.15s;user-select:none}
  .row:hover{background:#161616}.row:active{transform:scale(0.995)}
  .row.caught{background:#0a1a0a;border-left-color:#2d5a2d;opacity:0.6}
  .cb{width:22px;height:22px;border-radius:4px;flex-shrink:0;border:2px solid #333;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
  .caught .cb{border-color:var(--green);background:var(--green)}
  .cb .ck{display:none;color:#fff;font-size:14px;font-weight:700;line-height:1}
  .caught .cb .ck{display:block}
  .dxn{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;width:30px;text-align:right;flex-shrink:0}
  .caught .dxn{color:#664433}
  .natn{font-family:'JetBrains Mono',monospace;font-size:10px;color:#444;width:38px;text-align:right;flex-shrink:0}
  .pn{font-weight:600;font-size:14px;min-width:110px}
  .caught .pn{color:#5a5a5a;text-decoration:line-through;text-decoration-color:#333}
  .types{display:flex;gap:4px;flex-shrink:0}
  .tb{font-size:10px;padding:2px 7px;border-radius:3px;color:#fff;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,0.5);white-space:nowrap}
  .vb{font-size:9px;padding:2px 6px;border-radius:3px;font-weight:700;flex-shrink:0;font-family:'JetBrains Mono',monospace;white-space:nowrap}
  /* SWAPPED: Blue=Both, Red=FR, Green=LG */
  .vboth{background:#0f1a2e;border:1px solid #1a3060;color:#5599dd}
  .vfr{background:#2e1010;border:1px solid #5a2020;color:#dd6655}
  .vlg{background:#0e2e14;border:1px solid #1a4a26;color:#55cc66}
  .loc{font-size:11px;color:#666;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .abil{font-size:10px;color:#555;flex-shrink:0;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'JetBrains Mono',monospace}
  .caught .abil{color:#444}
  .legend{display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap;padding:8px 12px;background:#0d0d0d;border-radius:6px;border:1px solid #1a1a1a}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:#888}
  .legend-dot{width:10px;height:10px;border-radius:2px}
  .footer{margin-top:24px;padding:16px 0;border-top:1px solid #1a1a1a;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .footer-text{font-size:11px;color:#444}
  .rbtn{padding:6px 12px;background:#1a1111;border:1px solid #2a1515;border-radius:4px;color:#884444;font-size:11px;cursor:pointer;font-family:'Outfit',sans-serif}
  .rbtn:hover{background:#2a1515;color:#aa5555}
  
  .row.unstable { opacity:0.45; border-left-color:#ff664440; background:#161111; cursor:default; animation:flicker 2s ease-in-out infinite alternate; }
  .row.unstable .dxn { color:#ff664466; }
  .row.unstable .pn { color:#aa6666; font-style:italic; }
  .row.unstable .cb { visibility:hidden; }
  @keyframes flicker { 0%{opacity:0.35} 50%{opacity:0.5} 100%{opacity:0.35} }
  @media(max-width:640px){.loc{display:none}.abil{display:none}.pn{min-width:90px;font-size:13px}.title{font-size:18px}.progress-count{font-size:22px}.natn{display:none}}
</style>
</head>

  <div class="actions-row" id="actionsRow"></div>
  <div class="controls">
    <input type="text" class="search" id="search" placeholder="Search name, #, location, or ability...">

  </div>
</div></div>
<div class="list">

  </div>
  
  <div class="legend" style="flex-direction:column;gap:6px;margin-bottom:8px" id="runNote">
  </div>
  <div class="list-info" id="list-info"></div><div id="rows"></div>
  <div class="footer"><span class="footer-text">Each mode saves separately in your browser</span></div>
</div>

  if(impLG)impLG.addEventListener("click",()=>{
    const src=caughtAll["1lg"]||{};
    if(!Object.keys(src).length){alert("No LeafGreen progress to import.");return;}
    const nn=getNewNames(src);
    if(!nn.length){alert("All LeafGreen Pokemon are already checked in FR+LG.");return;}
    if(!confirm(`Import ${nn.length} new Pokemon from LeafGreen:\n\n${nn.join(", ")}`))return;
    Object.keys(src).forEach(k=>{caught[k]=true;});save();render();
  });
  // Wire reset
  document.getElementById("resetMode").addEventListener("click",()=>{
    if(confirm(`Reset ${rlbl[setup]} progress? This won't affect other modes.`)){
      caughtAll[setup]={};caught=caughtAll[setup];
      if(setup==="1fr"||setup==="1lg"){mStarter="none";mFossil="none";if(measurements[setup]){measurements[setup]={s:"none",f:"none"};}}
      save();render();
    }
  });
  const filtered=P.filter(p=>mf(p,availSet));
  document.getElementById("list-info").textContent=`${filtered.length} shown · click to toggle`;
  document.querySelectorAll('.vb-hide').forEach(e=>e.remove());
  const dxnColor=setup==='frlg'?'#5599dd':setup==='1fr'?'#ff6644':'#55cc66';
  const dxnDim=setup==='frlg'?'#334466':setup==='1fr'?'#664433':'#336644';
  if(setup==="1fr"||setup==="1lg"){const s=document.createElement('style');s.className='vb-hide';s.textContent='.vb{display:none}';document.head.appendChild(s);}
  const c=document.getElementById("rows");c.innerHTML="";

  filtered.forEach(p=>{
    const ic=!!caught[p.n];
    const vc=p.v==="Both"?"vboth":p.v==="FR"?"vfr":"vlg";
    const vl=p.v==="Both"?"FR+LG":p.v;
    const dn=dexMap.get(p.n)||"?";
    const unstable=isUnstable(p);
    const d=document.createElement("div");
    d.className=`row${ic?" caught":""}${unstable?" unstable":""}`;
    const abilText=p.a2?`${p.a1} / ${p.a2}`:p.a1;
    d.innerHTML=`<div class="cb"><span class="ck">✓</span></div><span class="dxn" style="color:${ic?dxnDim:dxnColor}">${dn}</span><span class="natn">#${String(p.n).padStart(3,"0")}</span><span class="pn">${p.name}</span><div class="types"><span class="tb" style="background:${TC[p.t1]||"#666"}">${p.t1}</span>${p.t2?`<span class="tb" style="background:${TC[p.t2]||"#666"}">${p.t2}</span>`:""}</div><span class="abil" title="${abilText}">${abilText}</span><span class="vb ${vc}">${vl}</span><span class="loc">${p.loc}</span>`;
    if(!unstable){
      d.addEventListener("click",()=>{caught[p.n]?delete caught[p.n]:caught[p.n]=true;save();render()});
    }
    c.appendChild(d);
  });
}
document.getElementById("search").addEventListener("input",e=>{searchVal=e.target.value;render()});
document.getElementById("statusF").addEventListener("change",e=>{filterVal=e.target.value;render()});
document.getElementById("typeF").addEventListener("change",e=>{typeVal=e.target.value;render()});
document.getElementById("abilF").addEventListener("change",e=>{abilVal=e.target.value;render()});
document.querySelectorAll(".setup-btn").forEach(b=>{b.addEventListener("click",()=>{
  saveMeasure();setup=b.dataset.setup;
  caught=caughtAll[setup]||(caughtAll[setup]={});
  if(setup==="1fr"||setup==="1lg"){mStarter=(measurements[setup]||{}).s||"none";mFossil=(measurements[setup]||{}).f||"none";}else{mStarter="none";mFossil="none";}
  save();
  document.querySelectorAll(".setup-btn").forEach(x=>{
    const s=x.dataset.setup;
    if(s===setup){
      x.classList.add("active");
      if(s==="frlg"){x.style.borderColor="#3366cc";x.style.background="#0a1030";x.style.color="#5599dd"}
      else if(s==="1fr"){x.style.borderColor="#cc3333";x.style.background="#2a0a0a";x.style.color="#dd6655"}
      else{x.style.borderColor="#33aa44";x.style.background="#0a2a0a";x.style.color="#55cc66"}
    } else {
      x.classList.remove("active");
      if(s==="frlg"){x.style.borderColor="#331133";x.style.background="#0a0a1a";x.style.color="#334466"}
      else if(s==="1fr"){x.style.borderColor="#331111";x.style.background="#1a0a0a";x.style.color="#884444"}
      else{x.style.borderColor="#113311";x.style.background="#0a1a0a";x.style.color="#448844"}
    }
  });
  render();
})});
document.getElementById("dexMode").addEventListener("change",e=>{finalOnly=e.target.value==="final";render()});
