<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temporarily offline</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; background: #f6f5f1; color: #242b28; }
    main { box-sizing: border-box; width: min(100%, 38rem); padding: 2rem; }
    h1 { font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1.1; letter-spacing: -.04em; margin: 0 0 1rem; }
    p { font-size: 1.05rem; line-height: 1.7; color: #5e6762; margin: 0; }
    @media (prefers-color-scheme: dark) { body { background: #18211d; color: #edf1ee; } p { color: #aebbb2; } }
  </style>
</head>
<body>
  <main>
    <h1>Temporarily offline.</h1>
    <p>This site is taking a short break.<br>Please check back in a few days.</p>
  </main>
</body>
</html>
