<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LIN228 Quiz 2 Game · Bennett Hon</title>
  <link rel="icon" href="puonx.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#182234;
      background-color:#002255;
      background-image:
        radial-gradient(1100px 500px at 15% -10%, #0a3a80 0%, transparent 60%),
        radial-gradient(900px 500px at 100% 0%, #013a78 0%, transparent 55%);
      background-attachment:fixed;
    }
    .card{width:min(100%,560px);background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 12px 28px rgba(0,12,40,.28)}
    .panel-title{padding:14px 22px;background:linear-gradient(135deg,#1c8fd6,#4fb3f0);color:#fff;font:600 1.08rem/1.5 Lora,Georgia,serif}
    .card-body{padding:22px;font-size:.95rem;line-height:1.65}
    .card-body p{margin:0 0 12px}
    .status{display:inline-block;padding:3px 10px;border-radius:999px;background:#e6f2fc;color:#1c6fa8;font-size:.78rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
    a{color:#1c8fd6;text-decoration:none}
    a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <main class="card">
    <div class="panel-title">LIN228 · Phonetics Quiz 2 Interactive Game</div>
    <div class="card-body">
      <p><span class="status">In preparation</span></p>
      <p>An interactive game for LIN228 Phonetics Quiz 2 is on its way. It should be ready by <strong>November 27, 2026</strong>.</p>
      <p><a href="index.html#games">← Back to Linguistics Games</a></p>
    </div>
  </main>
</body>
</html>
